[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pi05-ur10e-vla"
version = "0.1.0"
description = "UR10e gamepad demonstration collection and pi0.5 deployment integration"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
data = ["pyarrow>=14", "imageio[ffmpeg]>=2.31"]
deployment = ["openpi-client"]
training = ["openpi"]
viewer = ["matplotlib>=3.8", "pyarrow>=14"]
dev = ["pytest>=7.4", "PyYAML>=6", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/pi05_ur10e"]

[tool.uv.sources]
openpi = { path = "../openpi05-post-train-compat-lerobot-v3/openpi05-post-train-compat-lerobot-v3", editable = true }
openpi-client = { path = "../openpi05-post-train-compat-lerobot-v3/openpi05-post-train-compat-lerobot-v3/packages/openpi-client", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
